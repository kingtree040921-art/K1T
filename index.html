<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小臭屁我最爱你啦 ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a081f 0%, #3a1c40 50%, #1a081f 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .stars {
            position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px 25px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.5s ease-in-out;
        }
        .heart-icon {
            font-size: 50px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 15px;
            display: inline-block;
        }
        .text-box {
            color: #fff;
            font-size: 17px;
            line-height: 1.8;
            min-height: 110px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            padding: 12px 35px;
            color: white;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
        
        /* 核心升级：隐藏的照片区域 */
        .photo-box {
            display: none;
            width: 100%;
            margin-top: 15px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .photo-box img {
            width: 100%;
            display: block;
        }

        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp linear forwards;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.3); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="stars" id="starsContainer"></div>

    <div class="card">
        <div class="heart-icon" id="mainHeart">❤️</div>
        <div class="text-box" id="typingText"></div>
        <button class="btn" id="unlockBtn" onclick="burstHearts()">点击解锁惊喜</button>
        
        <div class="photo-box" id="photoBox">
            <img src="her.jpg" alt="Our Memory">
        </div>
    </div>

    <audio id="bgm" loop src="https://music.163.com/song/media/outer/url?id=1815194121.mp3"></audio>

    <script>
        const lines = [
            "小臭屁",
            "脑公想你啦",
            "有时候搞些乱七八糟的就没看到你的信息",
            "但是脑公最爱你啦",
            "脑公最爱最爱你啦✨"
        ];

        let lineIndex = 0;
        let charIndex = 0;
        const textBox = document.getElementById('typingText');

        function type() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    textBox.innerHTML += lines[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(type, 100);
                } else {
                    textBox.innerHTML += '<br>';
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(type, 500);
                }
            }
        }

        window.onload = () => {
            setTimeout(type, 800);
            setInterval(() => createGlobalHeart(false), 500); // 平时零星飘心
        };

        // 核心改动：点击按钮后的疯狂反馈机制
        function burstHearts() {
            // 1. 尝试播放音乐（允许失败，不卡死）
            const audio = document.getElementById('bgm');
            audio.play().catch(() => console.log("音乐被浏览器拦截，静音播放"));
            
            // 2. 隐藏按钮，放出照片
            document.getElementById('unlockBtn').style.display = 'none';
            document.getElementById('photoBox').style.display = 'block';
            document.getElementById('mainHeart').innerHTML = '💖';
            
            // 3. 瞬间炸开 50 颗心
            for(let i=0; i<50; i++) {
                setTimeout(() => createGlobalHeart(true), i * 20);
            }
        }

        function createGlobalHeart(isBurst) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = ['❤️','💖','💕','🌸','✨'][Math.floor(Math.random()*5)];
            
            // 如果是点击炸开的，让心从屏幕中间偏下爆发；如果是平时，随机横向分布
            if (isBurst) {
                heart.style.left = (Math.random() * 60 + 20) + 'vw';
            } else {
                heart.style.left = Math.random() * 100 + 'vw';
            }
            
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            const duration = Math.random() * 2 + 2.5;
            heart.style.animationDuration = duration + 's';
            
            document.getElementById('starsContainer').appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
    </script>
</body>
</html>
